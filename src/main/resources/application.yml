spring:
  application:
    name: jeoparody-party
  datasource:
    # Defaults point at the docker-compose MySQL; CI and Cloud Run override via env vars.
    url: ${DB_URL:jdbc:mysql://localhost:3306/jeopardy}
    username: ${DB_USER:jeopardy}
    password: ${DB_PASSWORD:jeopardy}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}   # Cloud Run injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info

trivia:
  base-url: https://opentdb.com
  import-on-startup: ${TRIVIA_IMPORT_ON_STARTUP:true}
  questions-per-category: 50          # page size per request (Open Trivia DB max is 50)
  max-questions-per-category: 300     # stop paging a category after this many
  request-delay: 5500ms   # Open Trivia DB allows one request per 5 seconds per IP
  # Pop-culture focused Open Trivia DB category ids:
  # 10 Books, 11 Film, 12 Music, 13 Musicals & Theatres, 14 Television, 15 Video Games, 16 Board Games,
  # 26 Celebrities, 29 Comics, 31 Japanese Anime & Manga, 32 Cartoon & Animations
  categories: [11, 12, 13, 14, 15, 26, 32, 31, 29, 16, 10]
  enrichment:
    # Rewrites clues into Jeopardy form and tags them with keywords using Gemini on Vertex AI.
    # Locally this uses your `gcloud auth application-default login`; on Cloud Run, the service account.
    enabled: ${TRIVIA_ENRICHMENT_ENABLED:true}
    project: ${GOOGLE_CLOUD_PROJECT:jeoparody-party}
    location: ${GEMINI_LOCATION:global}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    batch-size: 20
    max-attempts: 3
  wiki:
    # Writes specific categories ("Fire Emblem", "Hamilton") from Wikipedia articles with Gemini.
    # Only clues whose quoted evidence appears in the article are kept.
    enabled: ${TRIVIA_WIKI_ENABLED:true}
    api-url: https://en.wikipedia.org/w/api.php
    seed-on-startup: ${TRIVIA_WIKI_SEED:true}   # queue the starter topics once, on a database with no topics
    clues-per-topic: 24
    max-article-chars: 60000
    # Topic syntax:  Keyword = Exact Wikipedia page [Group Keyword, ...] {count: note for the writer}
    #   only the keyword is required; groups also add the clues to broader categories ("Shounen Anime").
    # Starter topics are synced on every start: new lines are queued, edited lines update in place.
    starter-topics:
      # Video games
      - "Final Fantasy [Video Games]"
      - "Harvest Moon = Harvest Moon (video game series) [Video Games]"
      - "Fire Emblem [Video Games]"
      - "The Legend of Zelda [Video Games]"
      - "Pokemon = Pokémon [Video Games]"
      - "Super Mario [Video Games]"
      - "Kingdom Hearts [Video Games]"
      - "Persona = Persona (series) [Video Games]"
      - "Metal Gear [Video Games]"
      - "Halo = Halo (franchise) [Video Games]"
      - "The Elder Scrolls [Video Games]"
      - "Animal Crossing [Video Games]"
      - "Street Fighter [Video Games]"
      - "Sonic the Hedgehog [Video Games]"
      - "Minecraft [Video Games]"
      - "Stardew Valley [Video Games]"
      - "Mass Effect [Video Games]"
      # Video games of the last 10 years
      - "Expedition 33 = Clair Obscur: Expedition 33 [Video Games, Modern Video Games]"
      - "Fire Emblem Three Houses = Fire Emblem: Three Houses [Video Games, Modern Video Games]"
      - "Pokemon Games = Pokémon (video game series) [Video Games, Modern Video Games]"
      - "Genshin Impact [Video Games, Modern Video Games]"
      - "Elden Ring [Video Games, Modern Video Games]"
      - "Hollow Knight [Video Games, Modern Video Games]"
      - "Hades = Hades (video game) [Video Games, Modern Video Games]"
      - "Overwatch = Overwatch (video game) [Video Games, Modern Video Games]"
