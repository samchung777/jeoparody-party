spring:
  application:
    name: jeoparody-party
  datasource:
    # Defaults point at the docker-compose MySQL; CI and Cloud Run override via env vars.
    url: ${DB_URL:jdbc:mysql://localhost:3306/jeopardy}
    username: ${DB_USER:jeopardy}
    password: ${DB_PASSWORD:jeopardy}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}   # Cloud Run injects PORT

management:
  endpoints:
    web:
      exposure:
        include: health,info

trivia:
  base-url: https://opentdb.com
  import-on-startup: ${TRIVIA_IMPORT_ON_STARTUP:true}
  questions-per-category: 50          # page size per request (Open Trivia DB max is 50)
  max-questions-per-category: 300     # stop paging a category after this many
  request-delay: 5500ms   # Open Trivia DB allows one request per 5 seconds per IP
  # Pop-culture focused Open Trivia DB category ids:
  # 10 Books, 11 Film, 12 Music, 13 Musicals & Theatres, 14 Television, 15 Video Games, 16 Board Games,
  # 26 Celebrities, 29 Comics, 31 Japanese Anime & Manga, 32 Cartoon & Animations
  categories: [11, 12, 13, 14, 15, 26, 32, 31, 29, 16, 10]
  enrichment:
    # Rewrites clues into Jeopardy form and tags them with keywords using Gemini on Vertex AI.
    # Locally this uses your `gcloud auth application-default login`; on Cloud Run, the service account.
    enabled: ${TRIVIA_ENRICHMENT_ENABLED:true}
    project: ${GOOGLE_CLOUD_PROJECT:jeoparody-party}
    location: ${GEMINI_LOCATION:global}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    batch-size: 20
    max-attempts: 3
  wiki:
    # Writes specific categories ("Fire Emblem", "Hamilton") from Wikipedia articles with Gemini.
    # Only clues whose quoted evidence appears in the article are kept.
    enabled: ${TRIVIA_WIKI_ENABLED:true}
    api-url: https://en.wikipedia.org/w/api.php
    seed-on-startup: ${TRIVIA_WIKI_SEED:true}   # queue the starter topics once, on a database with no topics
    clues-per-topic: 24
    max-article-chars: 60000
    # "Keyword = Exact Wikipedia page" picks the right article for ambiguous names.
    starter-topics:
      # Video games
      - Final Fantasy
      - "Expedition 33 = Clair Obscur: Expedition 33"
      - Harvest Moon = Harvest Moon (video game series)
      - Fire Emblem
      - The Legend of Zelda
      - Pokemon = Pokémon
      - Super Mario
      - Kingdom Hearts
      - Persona = Persona (series)
      - Metal Gear
      - Halo = Halo (franchise)
      - The Elder Scrolls
      - Animal Crossing
      - Street Fighter
      - Sonic the Hedgehog
      - Minecraft
      - Stardew Valley
      - Mass Effect
      # Musicals
      - Hamilton = Hamilton (musical)
      - The Outsiders = The Outsiders (musical)
      - Phantom of the Opera = The Phantom of the Opera (1986 musical)
      - Les Miserables = Les Misérables (musical)
      - Wicked = Wicked (musical)
      - Rent = Rent (musical)
      - Cats = Cats (musical)
      - Dear Evan Hansen
      - Hadestown
      - Six = Six (musical)
      # Film and TV
      - Star Wars
      - Harry Potter
      - Marvel Cinematic Universe
      - The Simpsons
      - Friends
      - The Office = The Office (American TV series)
      - Breaking Bad
      - Stranger Things
      - Pixar
      - Studio Ghibli
      - Back to the Future
      # Music
      - The Beatles
      - Taylor Swift
      - Queen = Queen (band)
      - Michael Jackson
      - Beyonce = Beyoncé
      - Nirvana = Nirvana (band)
