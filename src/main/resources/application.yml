  wiki:
    # Writes specific categories ("Fire Emblem", "Hamilton") from Wikipedia articles with Gemini.
    # Only clues whose quoted evidence appears in the article are kept.
    enabled: ${TRIVIA_WIKI_ENABLED:true}
    api-url: https://en.wikipedia.org/w/api.php
    seed-on-startup: ${TRIVIA_WIKI_SEED:true}   # queue the starter topics once, on a database with no topics
    # Target clues per Wikipedia topic, and a cap on article size sent to Gemini (cost and token limit).
    clues-per-topic: 24
    max-article-chars: 60000
    # Topic syntax:  Keyword = Exact Wikipedia page [Group Keyword, ...] {count: note for the writer}
    #   only the keyword is required; groups also add the clues to broader categories ("Shounen Anime").
    # Starter topics are synced on every start: new lines are queued, edited lines update in place.
