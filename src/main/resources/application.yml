# Main Spring Boot settings, used everywhere (local, CI, Cloud Run).
# Values like ${DB_URL:default} read an environment variable and fall back to the default, so one jar
# can run in every environment: docker-compose locally, the MySQL sidecar in CircleCI, Cloud Run in
# production (where application-cloud.yml adds Cloud SQL settings on top, via SPRING_PROFILES_ACTIVE=cloud).
spring:
  application:
    # Shows up in logs ('[jeoparody-party]') and Actuator.
    name: jeoparody-party
  datasource:
    # Defaults point at the docker-compose MySQL; CI and Cloud Run override via env vars.
    url: ${DB_URL:jdbc:mysql://localhost:3306/jeopardy}
    username: ${DB_USER:jeopardy}
    password: ${DB_PASSWORD:jeopardy}
  # Run database migrations on start-up (see db/migration). This is how schema changes deploy.
  flyway:
    # Migrations live in src/main/resources/db/migration and are never edited once released: Flyway
    # stores each file's checksum in flyway_schema_history and refuses to start if an applied file changes
    # (that includes comments). A schema change is always a NEW file, e.g. V9__something.sql.
    #   V1 trivia: category + clue tables (Open Trivia DB questions, de-duplicated by question_hash)
    #   V2 keywords: Jeopardy wording columns, keyword + clue_keyword (categories are built from keywords)
    #   V3 pop culture titles: enrich_version (re-tag when the prompt improves), keyword.title (punny names)
    #   V4 game results: game_result + game_result_team (live games stay in memory; only results are saved)
    #   V5 clue feedback: retired_at / feedback_note on clue, clue_feedback log (host removes or rewords)
    #   V6 wiki topics: source_url / source_quote on clue, wiki_topic queue
    #   V7 story focus: review_version (behind-the-scenes review pass), wiki_topic.prompt_version
    #   V8 remove categories: keyword.retired_at / retired_note (host removes a whole category)
    enabled: true

server:
  port: ${PORT:8080}   # Cloud Run injects PORT

app:
  # Background content jobs at start-up (import, enrichment, review, Wikipedia, genres). The research worker
  # sets this to false and runs them itself, in order, before exiting.
  startup-jobs: ${APP_STARTUP_JOBS:true}

# Actuator: expose only health and info over HTTP. /actuator/health is what smoke tests check first.
management:
  endpoints:
    web:
      exposure:
        include: health,info

# App-specific settings, bound to Java classes with @ConfigurationProperties (TriviaProperties,
# EnrichmentProperties, WikiProperties, review settings).
trivia:
  # Open Trivia DB: free public trivia API, the first source of clues.
  base-url: https://opentdb.com
  # Fetch new questions when the app starts (off in tests and on Cloud Run, which uses the copied database).
  import-on-startup: ${TRIVIA_IMPORT_ON_STARTUP:true}
  questions-per-category: 50          # page size per request (Open Trivia DB max is 50)
  max-questions-per-category: 300     # stop paging a category after this many
  request-delay: 5500ms   # Open Trivia DB allows one request per 5 seconds per IP
  # Pop-culture focused Open Trivia DB category ids:
  # 10 Books, 11 Film, 12 Music, 13 Musicals & Theatres, 14 Television, 15 Video Games, 16 Board Games,
  # 26 Celebrities, 29 Comics, 31 Japanese Anime & Manga, 32 Cartoon & Animations
  categories: [11, 12, 13, 14, 15, 26, 32, 31, 29, 16, 10]
  enrichment:
    # Rewrites clues into Jeopardy form and tags them with keywords using Gemini on Vertex AI.
    # Locally this uses your `gcloud auth application-default login`; on Cloud Run, the service account.
    enabled: ${TRIVIA_ENRICHMENT_ENABLED:true}
    project: ${GOOGLE_CLOUD_PROJECT:jeoparody-party}
    location: ${GEMINI_LOCATION:global}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    # Clues sent to Gemini per request, and how many times a clue is retried before it is skipped.
    batch-size: 20
    max-attempts: 3
  research:
    # More clues for stale categories (every clue shown 2+ times) and for topics players suggest.
    # Planned when a game ends; the slow part (wikis + Gemini) runs in a worker (see ResearchPlanner).
    enabled: ${TRIVIA_RESEARCH_ENABLED:true}
    mode: ${RESEARCH_MODE:local}           # local = background thread here; job = separate Cloud Run Job
    worker: ${RESEARCH_WORKER:false}        # true only inside the Cloud Run Job: do the work, then exit
    job-name: ${RESEARCH_JOB:jeoparody-research}
    region: ${RESEARCH_REGION:us-west1}
    project: ${GOOGLE_CLOUD_PROJECT:jeoparody-party}
    stale-threshold: 2                       # a category is stale once every clue has been shown twice
    clues-per-task: 20
    cooldown: 3d                             # don't re-research the same category within 3 days
    # Fan wikis read through their MediaWiki API, per keyword: "Keyword, Other Keyword = https://host/api.php".
    # Each listed category gets one fan-wiki research pass (20 clues), and stale categories use their fan wiki
    # first. A wrong or unreachable wiki just fails that task (see the library page); Wikipedia is unaffected.
    # Note: Fandom's terms of use forbid scraping and using its content for AI. To stop using Fandom, list
    # fandom.com, wikia.com and wikia.org under blocked-hosts.
    blocked-hosts: ${RESEARCH_BLOCKED_HOSTS:}
