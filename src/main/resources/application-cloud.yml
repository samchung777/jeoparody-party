# Profile for Cloud Run (SPRING_PROFILES_ACTIVE=cloud). Everything secret comes from Secret Manager
# as environment variables; nothing sensitive lives in this file or the image.
spring:
  datasource:
    # The Cloud SQL socket factory connects with the service account's IAM permissions (roles/cloudsql.client),
    # so the database needs no public IP allow-list.
    url: jdbc:mysql:///${DB_NAME:jeopardy}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
    username: ${DB_USER:jeopardy}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5    # the smallest Cloud SQL tier allows few connections

trivia:
  # The production database is seeded from a copy of the local one, so don't re-import on start-up.
  import-on-startup: ${TRIVIA_IMPORT_ON_STARTUP:false}
  wiki:
    seed-on-startup: ${TRIVIA_WIKI_SEED:false}

app:
  admin-key: ${ADMIN_KEY}     # required: protects /api/admin/** once the app is public
