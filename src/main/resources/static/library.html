<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeoparody Party – Trivia Library</title>
  <style>
    :root { --blue: #060ce9; --gold: #ffcc00; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0b0f3a; color: #fff; }
    header { background: var(--blue); padding: 16px 24px; }
    h1 { margin: 0; color: var(--gold); letter-spacing: 1px; }
    main { padding: 24px; max-width: 960px; margin: auto; }
    button { background: var(--gold); border: 0; padding: 8px 16px; font-weight: 700; cursor: pointer; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 8px; border-bottom: 1px solid #2a2f6a; text-align: left; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr.cat { cursor: pointer; } tr.cat:hover { background: #1a1f5a; }
    #status { margin-left: 12px; opacity: .85; }
    .clue { padding: 6px 0 6px 24px; color: #cfd3ff; }
    .clue b { color: var(--gold); }
    .clue .orig { font-size: 12px; opacity: .6; }
    .tag { display: inline-block; background: #1a1f5a; border: 1px solid #3a3f8a; border-radius: 12px;
           padding: 2px 10px; margin: 3px; font-size: 13px; }
    .tag small { opacity: .7; }
    h2 { color: var(--gold); margin-top: 32px; }
    footer { padding: 24px; font-size: 12px; opacity: .7; text-align: center; }
    a { color: var(--gold); }
  </style>
</head>
<body>
<header><h1><a href="/" style="color:inherit;text-decoration:none">JEOPARODY PARTY</a> <small style="font-size:16px;color:#fff">Trivia library</small></h1></header>
<main>
  <button id="import">Import more trivia</button><span id="status"></span>
  <div style="margin-top:8px"><button id="enrichBtn">Convert remaining clues</button>
    <span id="enrich" style="margin-left:12px;opacity:.85"></span></div>
  <h2>Keywords ready for the board <small style="font-size:14px;opacity:.7">(5+ clues)</small></h2>
  <div id="keywords">Loading…</div>
  <h2>Categories</h2>
  <table>
    <thead><tr><th>Category</th><th class="n">Easy</th><th class="n">Medium</th><th class="n">Hard</th></tr></thead>
    <tbody id="cats"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>
</main>
<footer>
  Trivia from <a href="https://opentdb.com">Open Trivia Database</a>, licensed
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
</footer>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function loadCategories() {
    const cats = await (await fetch('/api/categories')).json();
    const body = document.getElementById('cats');
    if (!cats.length) { body.innerHTML = '<tr><td colspan="4">No trivia yet – import is probably still running.</td></tr>'; return; }
    body.innerHTML = cats.map(c =>
      `<tr class="cat" data-id="${c.id}"><td>${esc(c.name)}</td><td class="n">${c.easy}</td><td class="n">${c.medium}</td><td class="n">${c.hard}</td></tr>`
    ).join('');
    body.querySelectorAll('tr.cat').forEach(r => r.addEventListener('click', () => toggleClues(r)));
  }

  async function toggleClues(row) {
    const next = row.nextElementSibling;
    if (next && next.classList.contains('clues')) { next.remove(); return; }
    const clues = await (await fetch(`/api/categories/${row.dataset.id}/clues?limit=10`)).json();
    const html = clues.map(c => c.jeopardyClue
      ? `<div class="clue">[${c.difficulty}] ${esc(c.jeopardyClue)} → <b>${esc(c.jeopardyResponse)}</b>
           ${c.keywords.map(k => `<span class="tag">${esc(k)}</span>`).join('')}
           <div class="orig">Original: ${esc(c.question)} → ${esc(c.answer)}</div></div>`
      : `<div class="clue">[${c.difficulty}] ${esc(c.question)} → <b>${esc(c.answer)}</b> <span class="orig">(not converted yet)</span></div>`
    ).join('');
    row.insertAdjacentHTML('afterend', `<tr class="clues"><td colspan="4">${html || '<div class="clue">No clues</div>'}</td></tr>`);
  }

  async function pollStatus() {
    const s = await (await fetch('/api/admin/import')).json();
    document.getElementById('status').textContent = s.running
      ? `Importing… ${s.categoriesDone}/${s.categoriesTotal} categories, ${s.cluesAdded} new clues`
      : (s.finishedAt ? `Last import added ${s.cluesAdded} clues${s.lastError ? ' (warning: ' + s.lastError + ')' : ''}` : '');
    if (s.running) { loadCategories(); setTimeout(pollStatus, 3000); }
    else { loadCategories(); }
  }

  async function loadKeywords() {
    const kws = await (await fetch('/api/keywords')).json();
    document.getElementById('keywords').innerHTML = kws.length
      ? kws.map(k => k.title
          ? `<span class="tag"><b style="color:var(--gold)">${esc(k.title)}</b> <small>${esc(k.name)} · ${k.total}</small></span>`
          : `<span class="tag">${esc(k.name)} <small>${k.total}</small></span>`).join('')
      : 'None yet – waiting for Gemini to tag clues.';
  }

  async function pollEnrichment() {
    const s = await (await fetch('/api/admin/enrich')).json();
    const el = document.getElementById('enrich');
    if (!s.enabled) { el.textContent = 'Gemini enrichment is turned off.'; return; }
    el.textContent = s.running
      ? `Gemini is converting clues… ${s.cluesEnriched} done, ${s.remaining} remaining`
      : `Gemini conversion idle – ${s.remaining} clues waiting${s.lastError ? ' (last error: ' + s.lastError + ')' : ''}`;
    loadKeywords();
    setTimeout(pollEnrichment, s.running ? 4000 : 15000);
  }

  document.getElementById('enrichBtn').addEventListener('click', async () => {
    await fetch('/api/admin/enrich', { method: 'POST' });
    setTimeout(pollEnrichment, 1000);
  });

  document.getElementById('import').addEventListener('click', async () => {
    await fetch('/api/admin/import', { method: 'POST' });
    pollStatus();
  });

  pollStatus();
  pollEnrichment();
</script>
</body>
</html>
