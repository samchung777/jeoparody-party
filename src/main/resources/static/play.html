<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jeoparody Party – Play</title>
  <link rel="stylesheet" href="/css/game.css">
  <style>
    body { min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--blue); }
    header .me { display: flex; align-items: center; gap: 10px; }
    header .me img { height: 34px; width: auto; background: #fff; border-radius: 4px; }
    header .score { font-size: 22px; font-weight: 800; }
    main { padding: 16px; max-width: 640px; margin: 0 auto; }
    h2 { margin: 0 0 8px; color: var(--gold); }
    .buzz {
      width: 100%; aspect-ratio: 1 / 1; max-height: 60vh; border-radius: 50%; font-size: 13vmin;
      font-family: Impact, "Arial Black", sans-serif; letter-spacing: 2px; background: #3a3f7a; color: #9aa0d9;
      box-shadow: 0 1.5vmin 0 #000a; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    .buzz.ready { background: var(--red); color: #fff; }
    .buzz.ready:active { transform: translateY(1vmin); box-shadow: 0 .5vmin 0 #000a; }
    .buzz.mine { background: var(--gold); color: #000; }
    .clue-small { font-size: 18px; line-height: 1.35; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .options .chip { width: 100%; }
    .counter { position: sticky; top: 0; background: var(--navy); padding: 8px 0; z-index: 1; }
    .center { text-align: center; }
    #searchResults:empty { display: none; }
    .search-note { font-size: 13px; }
    .genres { display: flex; flex-wrap: wrap; gap: 6px; }
    .genres button { padding: 6px 10px; font-size: 13px; border-radius: 999px; }
    .genres button.on { background: var(--gold); color: #000; }
    .steal { color: var(--gold); font-weight: 800; }
  </style>
</head>
<body>
<header>
  <div class="me" id="me"><b class="title-font gold">JEOPARODY PARTY</b></div>
  <div class="row"><span class="score" id="score"></span><span class="status-dot" id="conn"></span></div>
</header>
<main>
  <!-- Room code entry (when opened without ?game=) -->
  <section id="codeEntry" class="stack hidden">
    <h2>Join a game</h2>
    <input type="text" id="codeInput" placeholder="Room code (4 letters)" maxlength="4" autocapitalize="characters">
    <button id="codeGo">Next</button>
  </section>

  <!-- Persistent sections keep their inputs/drawings when new state arrives. -->
  <section id="join" class="stack hidden">
    <h2>Draw your team name</h2>
    <div id="namePad"></div>
    <input type="text" id="nameText" maxlength="24" placeholder="Team name (typed, used in the scoreboard)">
    <button id="joinBtn">Join game</button>
  </section>

  <section id="wager" class="stack hidden">
    <h2 id="wagerTitle">Make your wager</h2>
    <p id="wagerHint" class="muted"></p>
    <input type="number" id="wagerInput" inputmode="numeric">
    <button id="wagerBtn">Lock in wager</button>
  </section>

  <section id="search" class="stack hidden" style="margin-bottom:16px">
    <h2 style="margin-bottom:0">Find a category</h2>
    <div id="genres" class="genres"></div>
    <input type="search" id="searchInput" placeholder="Search every category, e.g. Zelda, Hamilton, Shounen" autocomplete="off">
    <div id="searchResults" class="options"></div>
    <p id="searchNote" class="muted search-note" style="margin:0"></p>
  </section>

  <section id="finalAnswer" class="stack hidden">
    <h2>Final Jeopardy</h2>
    <p id="finalClue" class="clue-small clue-font"></p>
    <p class="muted">Write your response (in the form of a question!)</p>
    <div id="answerPad"></div>
    <input type="text" id="answerText" maxlength="120" placeholder="Optional: type it too">
    <button id="answerBtn">Submit response</button>
    <p id="answerStatus" class="muted"></p>
  </section>

  <section id="main"></section>

  <section id="suggest" class="stack hidden" style="margin-top:24px">
    <h3 style="margin-bottom:0">Suggest a topic</h3>
    <p class="muted" style="margin:0">Want clues about a show, game or book we don't have? Suggestions are researched after the game.</p>
    <div class="row">
      <input type="text" id="suggestText" maxlength="80" placeholder="e.g. Gravity Falls" style="flex:1">
      <button class="secondary" id="suggestBtn">Suggest</button>
    </div>
  </section>
</main>
<!--
  Player phone screen (play.html?game=CODE). Join with a drawn team name, vote for categories (or search for
  one), buzz in, wager, and draw the Final Jeopardy answer. Everything goes over one WebSocket (role=player).
-->
<script src="/js/game.js"></script>
<script src="/js/drawpad.js"></script>
<script>
  const { esc, money, teamById } = Jeo;
  const $ = id => document.getElementById(id);
  const code = (Jeo.params().get('game') || '').toUpperCase();
  // The team id and token are saved in this phone's localStorage, so a refresh or lost connection rejoins the
  // same team instead of creating a new one.
  const storageKey = `jeoparody-team-${code}`;
  let state = null;

  const load = () => { try { return JSON.parse(localStorage.getItem(storageKey)); } catch { return null; } };
  const save = v => { try { v ? localStorage.setItem(storageKey, JSON.stringify(v)) : localStorage.removeItem(storageKey); } catch {} };

  if (!code) {
    $('codeEntry').classList.remove('hidden');
    $('codeGo').onclick = async () => {
      const c = $('codeInput').value.trim().toUpperCase();
      const res = await fetch(`/api/games/${encodeURIComponent(c)}`);
      if (res.ok) location.href = `/play.html?game=${encodeURIComponent(c)}`;
      else Jeo.toast('No game with that code');
    };
  } else {
    start();
  }

  function start() {
    const namePad = new DrawPad($('namePad'));
    const answerPad = new DrawPad($('answerPad'));

    // Connect as a player; if this phone already joined, send teamId and token so the server reconnects it.
    const conn = Jeo.connect(() => {
      const saved = load();
      return `game=${encodeURIComponent(code)}&role=player` +
        (saved ? `&teamId=${encodeURIComponent(saved.teamId)}&token=${encodeURIComponent(saved.token)}` : '');
    }, {
      onState: s => { state = s; render(); },
      onMessage: m => {
        if (m.type === 'joined') save({ teamId: m.teamId, token: m.token });
        if (m.type === 'rejoinFailed') save(null);
        if (m.type === 'searchResults' && m.query === $('searchInput').value.trim()) {
          searchResults = m.results;
          renderSearch();
        }
        if (m.type === 'browseResults' && m.genre === browseGenre) {
          searchResults = m.results;
          renderSearch();
        }
        if (m.type === 'suggested') Jeo.toast(`Thanks! "${m.topic}" will be researched after the game.`);
      },
      onStatus: up => $('conn').classList.toggle('on', up),
      onFatal: msg => { $('main').innerHTML = `<p>${esc(msg)}</p><p><a href="/play.html">Enter another code</a></p>`; hideAll(); }
    });

    $('joinBtn').onclick = () => {
      if (namePad.isEmpty() && !$('nameText').value.trim()) return Jeo.toast('Draw or type a team name');
      // Join: typed name plus the drawn name tag as a PNG data URL.
      conn.send('join', { name: $('nameText').value, drawing: namePad.isEmpty() ? null : namePad.toDataURL() });
    };
    $('wagerBtn').onclick = () => {
      const amount = Number($('wagerInput').value);
      if (!Number.isInteger(amount)) return Jeo.toast('Enter a whole number');
      conn.send('wager', { amount });
    };
    $('answerBtn').onclick = () => {
      if (answerPad.isEmpty() && !$('answerText').value.trim()) return Jeo.toast('Write a response first');
      conn.send('finalAnswer', { drawing: answerPad.isEmpty() ? null : answerPad.toDataURL(), text: $('answerText').value });
    };

    // Category search: debounced, results come back only to this phone.
    let searchTimer;
    // Genre buttons: list every category in that genre (within the host's theme). Only this phone gets the list.
    $('genres').addEventListener('click', e => {
      const b = e.target.closest('[data-genre]');
      if (!b) return;
      browseGenre = browseGenre === b.dataset.genre ? null : b.dataset.genre;
      $('searchInput').value = '';
      searchResults = [];
      if (browseGenre) conn.send('browse', { genre: browseGenre }, true);
      renderSearch();
    });
    $('suggestBtn').addEventListener('click', () => {
      if ($('suggestText').value.trim() && conn.send('suggest', { topic: $('suggestText').value })) $('suggestText').value = '';
    });

    $('searchInput').addEventListener('input', () => {
      browseGenre = null; // typing switches from genre browsing to search
      clearTimeout(searchTimer);
      const q = $('searchInput').value.trim();
      if (!q) { searchResults = []; renderSearch(); return; }
      // Debounced search: waits 250 ms after typing stops, then asks the server; only this phone gets results.
      searchTimer = setTimeout(() => conn.send('search', { query: q }, true), 250);
    });

    // Dynamic content uses delegated clicks.
    $('main').addEventListener('pointerdown', e => {
      if (e.target.closest('#buzz') && state && state.me && state.me.canBuzz) {
        e.preventDefault();
        // The buzz. The server decides who was first (Game.buzz is synchronized), so it's fair across phones.
        conn.send('buzz');
        if (navigator.vibrate) navigator.vibrate(40);
      }
    });
    const onChipClick = e => {
      const chip = e.target.closest('[data-kw]');
      if (!chip || !state || !state.me) return;
      const id = Number(chip.dataset.kw);
      if (state.phase === 'VOTING') {
        const ballot = new Set(state.me.ballot);
        if (ballot.has(id)) ballot.delete(id);
        else if (ballot.size >= state.maxVotes) return Jeo.toast(`You can pick up to ${state.maxVotes}`);
        else ballot.add(id);
        conn.send('vote', { keywordIds: [...ballot] });
      } else if (state.phase === 'FINAL_VOTING') {
        conn.send('voteFinal', { keywordId: id });
      }
    };
    $('main').addEventListener('click', onChipClick);
    $('searchResults').addEventListener('click', onChipClick);
  }

  let searchResults = [];
  let browseGenre = null; // the genre button that's on, if any
  let searchPhase = null;

  function renderSearch() {
    const me = (state && state.me) || {};
    const isFinal = state && state.phase === 'FINAL_VOTING';
    const picked = new Set(isFinal ? (me.finalVote == null ? [] : [me.finalVote]) : (me.ballot || []));
    $('genres').innerHTML = ((state && state.genres) || []).map(g =>
      `<button class="secondary ${g.name === browseGenre ? 'on' : ''}" data-genre="${esc(g.name)}">${esc(g.name)} <small>${g.count}</small></button>`).join('');
    $('searchResults').innerHTML = searchResults.map(o => `
      <button class="chip ${picked.has(o.id) ? 'on' : ''}" data-kw="${o.id}">
        <span>${esc(o.title)}</span><small>${esc(o.keyword)}</small></button>`).join('');
    const q = $('searchInput').value.trim();
    if (browseGenre) {
      $('searchNote').textContent = searchResults.length ? `Every ${browseGenre} category. Tap to vote.` : 'Loading…';
      return;
    }
    $('searchNote').textContent = !q ? (isFinal ? 'Type any category that isn\'t on a board, or pick one below.'
        : `Or pick from the random categories below. Searching covers all ${(state && state.searchableCount) || 0}.`)
      : searchResults.length ? 'Tap to vote. A searched category joins everyone\'s list.' : 'No categories match that.';
  }

  function hideAll() {
    ['join', 'wager', 'finalAnswer', 'search'].forEach(id => $(id).classList.add('hidden'));
  }

  function show(id) {
    hideAll();
    if (id) $(id).classList.remove('hidden');
  }

  // Redraws for the latest state: picks what to show from state.phase. Input sections (join, wager, Final)
  // stay in place so typing and drawings aren't wiped when a new state arrives.
  function render() {
    const s = state;
    const me = s.me;
    $('me').innerHTML = me
      ? (me && teamById(s, me.id) && teamById(s, me.id).drawing
          ? `<img src="${esc(teamById(s, me.id).drawing)}" alt=""><b>${esc(me.name)}</b>` : `<b>${esc(me.name)}</b>`)
      : '<b class="title-font gold">JEOPARODY PARTY</b>';
    $('score').innerHTML = me ? money(me.score) : '';

    if (!me) {
      const late = ['FINAL_WAGER', 'FINAL_ANSWER', 'FINAL_REVEAL', 'GAME_OVER'].includes(s.phase);
      show(late ? null : 'join');
      $('main').innerHTML = late ? '<p>This game is in Final Jeopardy, so new teams can\'t join. Enjoy the show!</p>' : '';
      return;
    }

    const html = {
      LOBBY: () => `<div class="center stack"><h2>You're in!</h2><p>Watch the big screen. The host will start the category vote soon.</p></div>`,
      VOTING: () => voteView(s.pool, new Set(me.ballot), `Pick up to ${s.maxVotes} categories`, `${me.ballot.length} / ${s.maxVotes} picked`),
      FINAL_VOTING: () => voteView(s.finalOptions, new Set(me.finalVote == null ? [] : [me.finalVote]),
        'Vote for the Final Jeopardy category', me.finalVote == null ? 'Tap one' : 'Vote saved – tap another to change'),
      BOARD: () => `<div class="center stack"><h2>${s.controlTeamId === me.id ? 'You pick the next clue!' : 'Get ready…'}</h2>
        <p class="muted">${s.controlTeamId === me.id ? 'Tell the host your category and amount.' : 'The buzzer appears when a clue is on screen.'}</p></div>`,
      DAILY_DOUBLE_WAGER: () => me.dailyDoubleWager ? '' : `<div class="center"><h2>Daily Double!</h2><p>${esc((teamById(s, s.clue.dailyDoubleTeamId) || {}).name || 'Another team')} is wagering.</p></div>`,
      CLUE: () => buzzView(s, me),
      FINAL_WAGER: () => me.finalEligible ? '' : '<div class="center"><h2>Final Jeopardy</h2><p>Only teams with a positive score play Final Jeopardy. Cheer the others on!</p></div>',
      FINAL_ANSWER: () => me.finalEligible ? '' : `<div class="center"><h2>Final Jeopardy</h2><p class="clue-small clue-font">${esc(s.final.text)}</p></div>`,
      FINAL_REVEAL: () => `<div class="center"><h2>The reveal!</h2><p>Watch the big screen.</p></div>`,
      GAME_OVER: () => `<div class="center stack"><h2>Game over!</h2><p>${(s.standings || []).map((t, i) => `${i + 1}. ${esc(t.name)} – ${money(t.score)}`).join('<br>')}</p></div>`
    }[s.phase] || (() => '');

    // Persistent sections
    if (s.phase === 'DAILY_DOUBLE_WAGER' && me.dailyDoubleWager) {
      showWager('Daily Double!', `Wager between $${me.wagerMin} and $${me.wagerMax} on "${s.clue.category}".`, me);
    } else if (s.phase === 'FINAL_WAGER' && me.finalEligible) {
      showWager(`Final Jeopardy: ${s.final.category}`,
        me.finalWager == null ? `Wager between $0 and $${me.wagerMax}.` : `Wager locked in: $${me.finalWager}. You can change it until the clue is revealed.`, me);
    } else if (s.phase === 'FINAL_ANSWER' && me.finalEligible) {
      show('finalAnswer');
      $('finalClue').textContent = s.final.text || '';
      $('answerStatus').textContent = me.finalAnswered ? 'Response submitted ✓ (you can resubmit until the host locks answers)' : '';
    } else {
      show(null);
    }
    if (s.phase === 'VOTING' || s.phase === 'FINAL_VOTING') {
      if (searchPhase !== s.phase) { // new vote: start with an empty search
        searchPhase = s.phase;
        $('searchInput').value = '';
        searchResults = [];
        browseGenre = null;
      }
      $('search').classList.remove('hidden');
      renderSearch(); // refresh the "picked" highlights
    } else if ($('searchInput').value) {
      $('searchInput').value = '';
      searchResults = [];
    }
    $('main').innerHTML = html();
    // Suggestions are offered whenever the phone isn't busy with a vote, a clue or Final Jeopardy.
    $('suggest').classList.toggle('hidden', !['LOBBY', 'BOARD', 'GAME_OVER'].includes(s.phase));
  }

  function showWager(title, hint, me) {
    const wasHidden = $('wager').classList.contains('hidden');
    show('wager');
    $('wagerTitle').textContent = title;
    $('wagerHint').textContent = hint;
    $('wagerInput').min = me.wagerMin;
    $('wagerInput').max = me.wagerMax;
    if (wasHidden) $('wagerInput').value = '';
  }

  function voteView(options, selected, title, counter) {
    return `<h2>${esc(title)}</h2><div class="counter muted">${esc(counter)}</div>
      <div class="options">${options.map(o => `
        <button class="chip ${selected.has(o.id) ? 'on' : ''}" data-kw="${o.id}">
          <span>${esc(o.title)}</span><small>${esc(o.keyword)}</small></button>`).join('')}</div>`;
  }

  function buzzView(s, me) {
    const c = s.clue;
    if (c.dailyDouble) {
      return `<div class="center stack"><h2>Daily Double</h2><p class="clue-small clue-font">${esc(c.text)}</p>
        <p>${me.answering ? 'Say your response to the host!' : 'Only the wagering team answers.'}</p></div>`;
    }
    let cls = '', label = 'WAIT';
    if (me.answering) { cls = 'mine'; label = 'ANSWER!'; }
    else if (me.lockedOut) { label = 'LOCKED'; }
    else if (c.revealed) { label = '—'; }
    else if (me.canBuzz && c.buzzersOpen) { cls = 'ready'; label = c.rebound ? 'STEAL!' : 'BUZZ'; }
    else if (c.answeringTeamId) { label = 'WAIT'; }
    return `<p class="center muted" style="margin-bottom:0">${esc(c.category)}${c.keyword && c.keyword !== c.category ? ' · ' + esc(c.keyword) : ''} · $${c.value}</p>
      <p class="clue-small clue-font center">${esc(c.text)}</p>
      ${c.rebound && me.canBuzz ? '<p class="center steal">Wrong answer! Buzzers are open again: steal it!</p>' : ''}
      <button id="buzz" class="buzz ${cls}">${label}</button>
      ${c.revealed ? `<p class="center gold clue-font">${esc(c.response || '')}</p>` : ''}`;
  }
</script>
</body>
</html>
